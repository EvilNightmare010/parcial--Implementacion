server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Con rutas de hash (#/...) el navegador nunca le pide al servidor
    # esas rutas, asi que basta con servir index.html normal.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
